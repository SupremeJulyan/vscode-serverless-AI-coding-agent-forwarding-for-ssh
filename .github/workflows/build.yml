name: Build and test

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  native-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: windows-2025
            platform: win32-x64
          - runner: windows-11-vs2026-arm
            platform: win32-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test native CLI
        run: cargo test --locked --manifest-path native-cli/Cargo.toml
      - name: Build native CLI
        run: node build/build-native-cli.js
        env:
          SAFS_CLI_PLATFORM: ${{ matrix.platform }}
      - name: Verify release asset
        run: node build/verify-native-cli.js
        env:
          SAFS_CLI_PLATFORM: ${{ matrix.platform }}
      - name: Smoke test native CLI
        shell: bash
        run: |
          bin/${{ matrix.platform }}/safs${{ startsWith(matrix.platform, 'win32-') && '.exe' || '' }} --help
          bin/${{ matrix.platform }}/safs${{ startsWith(matrix.platform, 'win32-') && '.exe' || '' }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: safs-${{ matrix.platform }}
          path: release-assets/safs-${{ matrix.platform }}${{ startsWith(matrix.platform, 'win32-') && '.exe' || '' }}
          if-no-files-found: error

  extension:
    needs: native-cli
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: safs-linux-x64
          path: release-assets
      - name: Install native CLI for integration tests
        run: |
          cp release-assets/safs-linux-x64 bin/linux-x64/safs
          chmod +x bin/linux-x64/safs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run vsix
      - uses: actions/upload-artifact@v4
        with:
          name: safs-universal-vsix
          path: '*.vsix'
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native-cli, extension]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: safs-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
