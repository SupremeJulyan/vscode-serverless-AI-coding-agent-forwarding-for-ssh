name: Build and test

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run vsix
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: safs-universal-vsix
          path: '*.vsix'
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: safs-node-cli
          path: dist/safs-cli.js
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: extension
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: safs-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
