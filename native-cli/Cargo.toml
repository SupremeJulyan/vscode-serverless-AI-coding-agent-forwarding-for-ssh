[package]
name = "safs-cli"
version = "1.7.9"
edition = "2021"

[[bin]]
name = "safs"
path = "src/main.rs"

[dependencies]
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
